[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kseb-review-2"
version = "1.0.0"
description = "KSEB Agentic DSS — Review 2 (July–September 2026): Forecasting pipeline, data reconciliation, feature engineering"
requires-python = ">=3.10"

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pydantic>=2.0",
    "lightgbm>=4.0",
    "pyyaml>=6.0",
    "openpyxl>=3.1",  # for Excel file loading (Data_final.xlsx)
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
    "mypy>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
markers = ["integration: marks tests as integration tests (deselect with '-m \"not integration\"')"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.ruff]
line-length = 120
target-version = "py310"
